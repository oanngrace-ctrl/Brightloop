{% extends 'base.html' %}{% block content %}<h2>Payments</h2><form method="post" class="card card-body mb-4"><div class="row g-2"><div class="col-md-5"><select class="form-select" name="invoice_id" required><option value="">Choose invoice</option>{% for i in invoices %}<option value="{{ i.id }}">Invoice #{{ i.id }} – {{ i.subscription.customer.name }} – ₹{{ i.total }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="amount" type="number" step="0.01" placeholder="Amount" required></div><div class="col-md-2"><select class="form-select" name="method">{% for m in ['UPI','Card','Bank transfer','Cash'] %}<option>{{ m }}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" name="note" placeholder="Note"></div></div><button class="btn btn-primary mt-3">Record payment</button></form><table class="table table-striped"><tr><th>Invoice</th><th>Customer</th><th>Amount</th><th>Method</th><th>Date</th><th>Note</th></tr>{% for p in payments %}<tr><td>#{{ p.invoice_id }}</td><td>{{ p.invoice.subscription.customer.name }}</td><td>₹{{ p.amount }}</td><td>{{ p.method }}</td><td>{{ p.paid_on }}</td><td>{{ p.note or '-' }}</td></tr>{% else %}<tr><td colspan="6">No payments yet.</td></tr>{% endfor %}</table>{% endblock %}
