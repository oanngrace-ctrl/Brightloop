{% extends 'base.html' %}{% block content %}<h2>Staff accounts</h2><form method="post" class="card card-body mb-4"><div class="row g-2"><div class="col-md-4"><input class="form-control" name="name" placeholder="Staff name" required></div><div class="col-md-4"><input class="form-control" name="email" type="email" placeholder="Email" required></div><div class="col-md-4"><input class="form-control" name="password" type="password" placeholder="Temporary password" required></div></div><button class="btn btn-primary mt-3">Create staff</button></form><ul class="list-group">{% for s in staff %}<li class="list-group-item">{{ s.name }} — {{ s.email }}</li>{% else %}<li class="list-group-item">No staff accounts.</li>{% endfor %}</ul>{% endblock %}
