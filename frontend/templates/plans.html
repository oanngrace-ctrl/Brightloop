{% extends 'base.html' %}{% block content %}<h2>Plans</h2><form method="post" class="card card-body mb-4"><div class="row g-2"><div class="col-md-4"><input class="form-control" name="name" placeholder="Plan name" required></div><div class="col-md-3"><input class="form-control" name="price" type="number" step="0.01" placeholder="Price" required></div><div class="col-md-3"><select class="form-select" name="billing_cycle">{% for c in ['Daily','Weekly','Monthly','Yearly'] %}<option>{{ c }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="min_quantity" type="number" min="1" value="1"></div></div><button class="btn btn-primary mt-3">Add plan</button></form><table class="table table-striped"><tr><th>Plan</th><th>Price</th><th>Billing</th><th>Min quantity</th></tr>{% for p in plans %}<tr><td>{{ p.name }}</td><td>₹{{ p.price }}</td><td>{{ p.billing_cycle }}</td><td>{{ p.min_quantity }}</td></tr>{% else %}<tr><td colspan="4">No plans yet.</td></tr>{% endfor %}</table>{% endblock %}
