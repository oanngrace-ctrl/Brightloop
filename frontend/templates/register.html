{% extends 'base.html' %}{% block content %}<div class="auth-card"><h2>Create account</h2><form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Register</button></form><p class="mt-3">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>{% endblock %}
